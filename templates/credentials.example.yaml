# Copy to credentials.local.yaml and fill in.
# credentials.local.yaml is what the QA agent loads by default.
# For parallel runs, give each worker its own employee account when possible.

employees:
  - email: employee@example.com
    password: "change-me"
    # optional labels used by plan-run / shards
    alias: employee_primary

  - email: employee.a@example.com
    password: "change-me"
    alias: employee_a

  - email: employee.b@example.com
    password: "change-me"
    alias: employee_b

managers:
  - email: manager@example.com
    password: "change-me"
    alias: manager_primary

# Optional preferred device serials (used when present & online)
devices: []
# e.g. ["emulator-5554", "emulator-5556"]

device_id: ""
apk_path: ""
